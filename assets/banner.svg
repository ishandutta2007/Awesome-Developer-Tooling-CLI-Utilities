<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .glow-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .stream-particle {
        animation: flowDash 6s linear infinite;
      }
      .pill-float-1 {
        animation: floatA 4s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: floatB 5s ease-in-out infinite alternate;
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }

      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.6; }
      }
      @keyframes floatA {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -120; }
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 19px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: "JetBrains Mono", Consolas, "Fira Code", monospace;
        font-size: 13px;
        font-weight: 600;
      }
      .code-font {
        font-family: "JetBrains Mono", Consolas, "Fira Code", monospace;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Ambient Orbs (Background Layers) -->
  <g filter="blur(30px)">
    <circle cx="220" cy="140" r="160" fill="url(#cyanOrb)" class="glow-pulse-1"/>
    <circle cx="980" cy="260" r="180" fill="url(#purpleOrb)" class="glow-pulse-2"/>
    <circle cx="650" cy="360" r="140" fill="url(#emeraldOrb)" class="glow-pulse-1"/>
  </g>

  <!-- Circuit / Stream Lines in Background -->
  <g opacity="0.35">
    <path d="M 50 100 L 250 100 L 320 170 L 600 170" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" class="stream-particle"/>
    <path d="M 1150 320 L 950 320 L 880 250 L 650 250" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="10 8" class="stream-particle"/>
    <path d="M 100 350 L 300 350 L 400 250" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 6" class="stream-particle"/>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Foreground Content: Header & Titles -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <g transform="translate(0, -60)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="-145" cy="0" r="4" fill="#38bdf8"/>
      <text x="5" y="4.5" fill="#38bdf8" font-size="12" class="code-font" font-weight="600" text-anchor="middle">🛠️ CURATED DEV ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text class="text-title" fill="url(#primaryTextGrad)" y="15">
      Awesome Developer Tooling &amp; CLI Utilities
    </text>

    <!-- Subtitle -->
    <text class="text-subtitle" y="58">
      SaaS Super-Platforms, Offline Developer Swiss-Knives &amp; High-Performance Modern Terminal Suites
    </text>

    <!-- Terminal Command Mockup Bar -->
    <g transform="translate(-250, 95)">
      <rect x="0" y="0" width="500" height="40" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="18" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
      <circle cx="34" cy="20" r="5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="50" cy="20" r="5" fill="#10b981" opacity="0.8"/>
      <text x="75" y="25" fill="#64748b" class="code-font" font-size="14" text-anchor="start">$</text>
      <text x="92" y="25" fill="#38bdf8" class="code-font" font-size="14" text-anchor="start">brew install</text>
      <text x="210" y="25" fill="#f1f5f9" class="code-font" font-size="14" text-anchor="start">fzf ripgrep jq bat zoxide lazygit</text>
      <rect x="470" y="11" width="8" height="18" fill="#38bdf8" class="cursor-blink"/>
    </g>
  </g>

  <!-- Interactive Floating Feature Cards & Tags (Left & Right Flanks) -->
  <!-- Left Side Badges -->
  <g class="pill-float-1" transform="translate(70, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
      <text x="20" y="23" fill="#38bdf8" class="pill-text">⚡ Rust &amp; Go CLI</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(180, 25)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
      <text x="20" y="23" fill="#34d399" class="pill-text">🔒 Offline &amp; Client-Side</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4"/>
      <text x="20" y="23" fill="#a5b4fc" class="pill-text">📦 Self-Hosted Stacks</text>
    </g>
  </g>

  <!-- Right Side Badges -->
  <g class="pill-float-2" transform="translate(755, 275)">
    <!-- Pill 4 -->
    <g transform="translate(20, 0)">
      <rect x="0" y="0" width="175" height="36" rx="18" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>
      <text x="20" y="23" fill="#d8b4fe" class="pill-text">🚀 SaaS Power Tools</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(190, 30)">
      <rect x="0" y="0" width="175" height="36" rx="18" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.4"/>
      <text x="20" y="23" fill="#fda4af" class="pill-text">🧩 Multi-Format Swiss</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(80, 60)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
      <text x="20" y="23" fill="#7dd3fc" class="pill-text">💻 Terminal Explorers</text>
    </g>
  </g>

</svg>
